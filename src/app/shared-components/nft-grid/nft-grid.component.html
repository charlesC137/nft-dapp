<div class="nft-grid">
  <div class="nft-card">
    <div class="img-container">
      <img src="https://placehold.co/600x400" alt="NFT Image" />

    </div>
    <div class="div"><span>Name: </span>Lorem ipsum dolor sit amet.</div>

    <div class="div"><span>Price: </span>1 ETH</div>

      <button class="glassy-button" *ngIf="profile && !onSale">

      <button class="glassy-button" *ngIf="profile && onSale">
        Cancel Listing
      </button>
      <button class="glassy-button">View</button>
    </div>
  </div>
