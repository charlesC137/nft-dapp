<div class="container">
  <section class="hero-section">
    <h1>Explore NFTs</h1>
    <h3>
      Discover unique NFTs created by top digital minds. Trade, collect, and
      flex — all from your wallet. Built on-chain. Owned by you. Forever.
    </h3>
  </section>

  <section class="filter-section">
    <div class="filter">
      <button class="glassy-button">All</button>
      <button class="glassy-button">Sold</button>
      <button class="glassy-button">For Sale</button>
      <button class="glassy-button active">
        <i class="fas fa-music"></i> Art
      </button>
      <button class="glassy-button">
        <i class="fas fa-gem"></i> Collectibles
      </button>
    </div>

    <select [(ngModel)]="filter">
      <option value="explore asc" selected>Explore</option>
      <option value="price asc">Price: Low to High</option>
      <option value="price desc">Price: High to Low</option>
      <option value="age asc">Newest To Oldest</option>
      <option value="age desc">Oldest To Newest</option>
    </select>

    <div class="search-bar">
      <i class="fas fa-search"></i>
      <input type="text" placeholder="Search for NFT by name..." />
    </div>

    <div class="extra">
      <div class="live-count">52 NFTs found</div>
      <button class="glassy-button">Clear All Filters</button>
    </div>
  </section>

  <app-nft-grid [filter]="filter"></app-nft-grid>
</div>
